<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --night: #16233f; --kraft: #d8b98a; --ink: #221c16; --tag: #f6e9cc;
        --string: #7a4e25; --red: #b52a1f; --lamp: #f5b921; --screen: #fbf6ec;
        --font-display: "Archivo Black"; --font-body: "Nunito";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--kraft); }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-body); color: var(--ink); }
      /* kraft paper: flat colour + fibre noise */
      .kraft { position: absolute; inset: 0; background-color: var(--kraft); }
      .kraft::after { content: ""; position: absolute; inset: 0; opacity: 0.09; pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9 0.08' numOctaves='3' seed='7'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      .nightbg { position: absolute; inset: 0; background: var(--night); }
      .disp { font-family: var(--font-display); letter-spacing: -0.01em; line-height: 1.02; }
      .lbl { font-family: var(--font-body); font-weight: 700; font-size: 40px; }
      /* price tag: a trait */
      .tag { position: absolute; width: 330px; height: 150px; background: var(--tag); border: 4px solid var(--ink);
        border-radius: 14px 14px 14px 14px; 
        display: flex; align-items: center; justify-content: center; padding-left: 40px;
        font-family: var(--font-display); font-size: 46px; color: var(--ink); }
      .tag::before { content: ""; position: absolute; left: 34px; top: 50%; width: 22px; height: 22px; margin-top: -11px;
        border-radius: 50%; border: 4px solid var(--ink); background: var(--kraft); }
      .tag .k { position: absolute; top: 4px; left: 64px; font-family: var(--font-body); font-weight: 800; font-size: 28px;
        letter-spacing: 0.04em; color: #6b5a44; }
      .stamp { position: absolute; font-family: var(--font-display); color: var(--red); border: 8px solid var(--red);
        border-radius: 12px; padding: 10px 34px; font-size: 76px; letter-spacing: 0.04em; }
      .bar { position: absolute; bottom: 0; width: 34px; background: var(--ink); border-radius: 4px 4px 0 0; }
      /* equations: each term can carry an underline and a plain-words label */
      .eq { font-family: var(--font-display); white-space: nowrap; line-height: 1.1; }
      .eq .t { display: inline-block; position: relative; padding: 0 6px; }
      .eq .t .u { position: absolute; left: 6px; right: 6px; top: 100%; margin-top: 4px; height: 8px; border-radius: 4px; background: var(--ink); }
      .eq .t .w { position: absolute; left: 50%; top: 100%; margin-top: 20px; transform: translateX(-50%); white-space: nowrap;
        font-family: var(--font-body); font-weight: 900; font-size: 34px; color: #3d3024; }
      .eq .red { color: var(--red); }
      .eq .red .u { background: var(--red); }
      .eq .red .w { color: var(--red); }
      .eq sub { font-size: 0.55em; }

    </style>
  </head>
