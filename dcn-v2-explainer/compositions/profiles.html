<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; perspective: 1800px; }
    #pf-title { position: absolute; left: 110px; top: 90px; font-size: 92px; }
    #pf-title em { font-style: normal; color: var(--red); }
    .pf-card { position: absolute; width: 560px; height: 300px; }
    .pf-face { position: absolute; inset: 0; border: 5px solid var(--ink); border-radius: 18px; background: var(--tag); }
    .pf-front { display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 84px; }
    .pf-front::before { content: ""; position: absolute; left: 34px; top: 50%; width: 30px; height: 30px; margin-top: -15px;
      border-radius: 50%; border: 5px solid var(--ink); background: var(--kraft); }
    .pf-back .pf-name { position: absolute; left: 26px; top: 14px; font-weight: 900; font-size: 30px; color: #6b5a44; }
    .pf-back .pf-count { position: absolute; right: 26px; top: 14px; font-weight: 900; font-size: 30px; color: var(--ink); }
    .pf-bars { position: absolute; left: 30px; right: 30px; top: 70px; bottom: 26px; }
    .pf-mid { position: absolute; left: 0; right: 0; top: 50%; height: 3px; background: #6b5a44; }
    .pf-b { position: absolute; width: 36px; border-radius: 4px; }
    #pf-note { position: absolute; left: 110px; top: 960px; font-weight: 800; font-size: 34px; color: #5c4a35; }
  </style>
  <div id="root" data-composition-id="profiles" data-width="1920" data-height="1080">
    <div class="kraft"></div>
    <div id="pf-title" class="disp">Trait <em>→</em> profile</div>
    <div class="pf-card" id="pf-c1" style="left:150px;top:300px" data-vals="0.8,-0.4,0.6,0.9,-0.7,0.3,-0.2,0.7">
      <div class="pf-face pf-front">Madrid</div>
      <div class="pf-face pf-back"><span class="pf-name">MADRID</span><span class="pf-count">8 numbers</span><div class="pf-bars"><div class="pf-mid"></div></div></div>
    </div>
    <div class="pf-card" id="pf-c2" style="left:720px;top:470px" data-vals="0.5,0.9,-0.6,-0.3,0.8,-0.8">
      <div class="pf-face pf-front">English</div>
      <div class="pf-face pf-back"><span class="pf-name">ENGLISH</span><span class="pf-count">6 numbers</span><div class="pf-bars"><div class="pf-mid"></div></div></div>
    </div>
    <div class="pf-card" id="pf-c3" style="left:1290px;top:640px; height:280px" data-vals="-0.7,0.9,0.4,-0.5">
      <div class="pf-face pf-front">11 pm</div>
      <div class="pf-face pf-back"><span class="pf-name">11 PM</span><span class="pf-count">4 numbers</span><div class="pf-bars"><div class="pf-mid"></div></div></div>
    </div>
  </div>
  <script>
    (function () {
      document.querySelectorAll("#root .pf-card").forEach((card) => {
        const vals = card.dataset.vals.split(",").map(Number);
        const bars = card.querySelector(".pf-bars");
        const W = 500 - 60, H = (parseInt(card.style.height) || 300) - 96, step = W / vals.length;
        vals.forEach((v, i) => {
          const b = document.createElement("div"); b.className = "pf-b";
          const h = Math.abs(v) * (H / 2 - 6);
          b.style.left = (i * step + (step - 36) / 2) + "px"; b.style.height = h + "px";
          b.style.top = v >= 0 ? `calc(50% - ${h}px)` : "calc(50% + 3px)";
          b.style.background = v >= 0 ? "#221c16" : "#7a4e25";
          bars.appendChild(b);
        });
      });
    })();
    const tl = gsap.timeline({ paused: true });
    ["#pf-c1", "#pf-c2", "#pf-c3"].forEach((id, i) => {
      tl.fromTo(id, { y: -120, opacity: 0, rotation: 0 }, { y: 0, opacity: 1, rotation: [-2, 1.5, -1][i], duration: 0.7, ease: "back.out(1.3)" }, 0.3 + i * 0.9);
    });
    tl.fromTo("#pf-title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 3.6);
    // each tag turns over to show its profile, on the word
    tl.set("#root .pf-back", { opacity: 0 }, 0);
    [["#pf-c1", 6.1], ["#pf-c2", 8.4], ["#pf-c3", 9.7]].forEach(([id, t]) => {
      tl.to(id, { scaleX: 0, duration: 0.22, ease: "power2.in" }, t);
      tl.set(id + " .pf-front", { opacity: 0 }, t + 0.22);
      tl.set(id + " .pf-back", { opacity: 1 }, t + 0.22);
      tl.to(id, { scaleX: 1, duration: 0.35, ease: "expo.out" }, t + 0.22);
    });
    window.__timelines["profiles"] = tl;
  </script>
</template>
