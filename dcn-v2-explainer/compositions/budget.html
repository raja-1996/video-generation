<template>

        const x = 40 + i * 420;
        c.insertAdjacentHTML("beforeend", `
          <div class="bg-bar bg-cn" style="left:${x}px;height:${H(cn).toFixed(0)}px"></div>
          <div class="bg-v bg-vv" style="left:${x}px;bottom:${(95 + H(cn)).toFixed(0)}px">${cn.toFixed(4)}</div>
          <div class="bg-bar bg-dnn" style="left:${x + 150}px;height:${H(dnn).toFixed(0)}px"></div>
          <div class="bg-v bg-vv" style="left:${x + 150}px;bottom:${(95 + H(dnn)).toFixed(0)}px">${dnn.toFixed(4)}</div>
          <div class="bg-x" style="left:${x - 10}px">${n} numbers</div>
          <div class="bg-ck" style="left:${x}px;bottom:${(150 + H(dnn)).toFixed(0)}px">cross wins</div>`);
      });
      c.insertAdjacentHTML("beforeend", `<div class="bg-key" style="left:1330px;top:-180px;color:var(--red)">■ only cross layers</div>
        <div class="bg-key" style="left:1330px;top:-126px;color:#5c4a35">■ usual (ReLU) layers</div>`);
    })();
    const tl = gsap.timeline({ paused: true });

    tl.fromTo(".bg-vv", { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.2 }, 5.0);
    tl.fromTo("#bg-foot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.5);
    tl.fromTo(".bg-ck", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)", stagger: 0.35 }, 8.0);
    tl.fromTo("#bg-q", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power4.out" }, 11.4);
