<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #nt-window { position: absolute; left: 110px; top: 110px; width: 900px; height: 860px; border: 18px solid #2b3a5c;
      border-radius: 6px; background: #0f1930; overflow: hidden; }
    #nt-window .sky { position: absolute; inset: 0; background: radial-gradient(120% 80% at 70% 0%, #26385f 0%, #0f1930 70%); }
    .nt-bldg { position: absolute; bottom: 0; background: #0a1224; }
    .nt-win { position: absolute; width: 18px; height: 24px; background: #f2c46d; }
    #nt-sill { position: absolute; left: 92px; top: 960px; width: 936px; height: 34px; background: #2b3a5c; border-radius: 4px; }
    #nt-mullion-v { position: absolute; left: 541px; top: 110px; width: 18px; height: 860px; background: #2b3a5c; }
    #nt-mullion-h { position: absolute; left: 110px; top: 470px; width: 900px; height: 18px; background: #2b3a5c; }
    #nt-time { position: absolute; left: 160px; top: 160px; color: #fbf6ec; font-size: 112px; }
    #nt-place { position: absolute; left: 166px; top: 290px; color: #f2c46d; font-size: 46px; font-weight: 800; }
    #nt-phone { position: absolute; left: 1210px; top: 90px; width: 470px; height: 900px; background: #0b0f1a;
      border-radius: 64px; padding: 22px; }
    #nt-screen { position: relative; width: 100%; height: 100%; border-radius: 46px; overflow: hidden; background: #1a2238; }
    #nt-app { position: absolute; inset: 0; background: var(--screen); opacity: 0; }
    #nt-status { position: absolute; left: 34px; top: 18px; font-weight: 800; font-size: 28px; color: #fbf6ec; z-index: 3; }
    #nt-appbar { position: absolute; left: 0; right: 0; top: 0; height: 120px; background: var(--screen); z-index: 2;
      border-bottom: 3px solid #e4d6b8; }
    #nt-appbar span { position: absolute; left: 30px; bottom: 18px; font-family: var(--font-display); font-size: 40px; color: var(--ink); }
    #nt-feed { position: absolute; left: 22px; right: 22px; top: 140px; }
    .nt-card { height: 180px; margin-bottom: 20px; border-radius: 22px; background: #fff; border: 3px solid #e4d6b8;
      position: relative; overflow: hidden; }
    .nt-card i { position: absolute; left: 14px; top: 14px; width: 150px; height: 146px; border-radius: 14px; }
    .nt-card b { position: absolute; left: 184px; top: 34px; height: 22px; width: 190px; background: #2f2a24; border-radius: 6px; }
    .nt-card u { position: absolute; left: 184px; top: 78px; height: 16px; width: 150px; background: #c9bba0; border-radius: 6px; }
    #nt-million { position: absolute; left: 160px; top: 640px; color: #fbf6ec; }
    #nt-million .disp { font-size: 132px; color: #fbf6ec; }
    #nt-million .lbl { color: #f2c46d; font-size: 46px; margin-top: 6px; }
    .nt-tag { width: 300px; height: 130px; font-size: 42px; }
  </style>
  <div id="root" data-composition-id="night" data-width="1920" data-height="1080">
    <div class="nightbg"></div>
    <div id="nt-window"><div class="sky"></div><div id="nt-city"></div></div>
    <div id="nt-mullion-v"></div><div id="nt-mullion-h"></div><div id="nt-sill"></div>
    <div id="nt-time" class="disp">11:04 pm</div>
    <div id="nt-place">Madrid</div>
    <div id="nt-million"><div class="disp" id="nt-count">0</div><div class="lbl">things she might tap</div></div>
    <div id="nt-phone"><div id="nt-screen">
      <div id="nt-status">11:04</div>
      <div id="nt-app">
        <div id="nt-appbar"><span>For you</span></div>
        <div id="nt-feed"></div>
      </div>
    </div></div>
    <div class="tag nt-tag" id="nt-t1" style="left:1270px;top:300px"><span class="k">CITY</span>Madrid</div>
    <div class="tag nt-tag" id="nt-t2" style="left:1270px;top:300px"><span class="k">LANGUAGE</span>English</div>
    <div class="tag nt-tag" id="nt-t3" style="left:1270px;top:300px"><span class="k">TIME</span>11 pm</div>
    <div class="tag nt-tag" id="nt-t4" style="left:1270px;top:300px"><span class="k">DEVICE</span>Phone</div>
  </div>
  <script>
    (function () {
      // deterministic city: buildings and lit windows from a seeded generator
      let s = 11;
      const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
      const city = document.getElementById("nt-city");
      let x = -20;
      while (x < 900) {
        const w = 90 + Math.floor(rnd() * 120), h = 220 + Math.floor(rnd() * 380);
        const b = document.createElement("div");
        b.className = "nt-bldg"; b.style.left = x + "px"; b.style.width = w + "px"; b.style.height = h + "px";
        for (let wy = 24; wy < h - 30; wy += 46) for (let wx = 16; wx < w - 24; wx += 34) {
          if (rnd() < 0.34) { const win = document.createElement("div"); win.className = "nt-win";
            win.style.left = wx + "px"; win.style.top = wy + "px"; win.style.opacity = (0.55 + rnd() * 0.45).toFixed(2); b.appendChild(win); }
        }
        city.appendChild(b); x += w + 8;
      }
      const hues = ["#e07a5f", "#81b29a", "#f2cc8f", "#3d5a80", "#c8553d", "#6d597a", "#98c1d9", "#b5838d"];
      const feed = document.getElementById("nt-feed");
      for (let i = 0; i < 40; i++) {
        const c = document.createElement("div"); c.className = "nt-card";
        c.innerHTML = `<i style="background:${hues[i % hues.length]}"></i><b style="width:${150 + (i * 37) % 80}px"></b><u></u>`;
        feed.appendChild(c);
      }
    })();
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#nt-time", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 0.0);
    tl.fromTo("#nt-place", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.9);
    // Maya opens the app
    tl.fromTo("#nt-app", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 3.6);
    tl.fromTo("#nt-status", { color: "#fbf6ec" }, { color: "#221c16", duration: 0.2 }, 3.6);
    // a million things: the feed rushes past
    tl.fromTo("#nt-feed", { y: 0 }, { y: -6600, duration: 3.2, ease: "power2.inOut" }, 6.2);
    tl.fromTo("#nt-million", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, 6.9);
    const cnt = { v: 0 };
    tl.fromTo(cnt, { v: 0 }, { v: 1000000, duration: 1.4, ease: "power2.out",
      onUpdate: () => { document.getElementById("nt-count").textContent = (Math.round(cnt.v / 1000) * 1000).toLocaleString("en-US"); } }, 6.9);
    tl.to(["#nt-million", "#nt-time", "#nt-place"], { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power3.in" }, 8.45);
    tl.to(["#nt-window", "#nt-mullion-v", "#nt-mullion-h", "#nt-sill"], { opacity: 0.35, duration: 0.5, ease: "power2.inOut" }, 8.45);
    // what the app knows about her: four tags come out of the phone
    const dest = [[230, 330], [610, 330], [230, 540], [610, 540]];
    ["#nt-t1", "#nt-t2", "#nt-t3", "#nt-t4"].forEach((id, i) => {
      tl.fromTo(id, { x: 0, y: 0, opacity: 0, rotation: 0 },
        { x: dest[i][0] - 1270, y: dest[i][1] - 300, opacity: 1, rotation: [-4, 3, -2, 4][i], duration: 0.7, ease: "back.out(1.4)" }, 8.6 + i * 0.12);
    });
    window.__timelines["night"] = tl;
  </script>
</template>
