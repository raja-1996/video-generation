<template>
  <style>

    #rc-head { position: absolute; left: 110px; top: 60px; }

    #rc-head .lbl { font-size: 38px; color: #3d3024; margin-top: 6px; }

    <div id="rc-key">Shorter bar = fewer mistakes · test log loss from 0.4400 · paper Table 6</div>
  </div>
  <script>
    (function () {
      const rows = [["DCN-V2", 0.4406, 1], ["DCN-Mix", 0.4408, 1], ["CrossNet", 0.4413, 1], ["AutoInt+", 0.442, 0], ["DeepFM", 0.442, 0],

      const b = document.getElementById("rc-board");
      rows.forEach(([n, v, ours], i) => {
        const w = ((v - 0.44) / 0.003) * 1100;
        b.insertAdjacentHTML("beforeend", `<div class="rc-row${ours ? " rc-ours" : ""}" id="rc-r${i}"><div class="rc-name">${n}</div>

      });
    })();
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#rc-head", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power4.out" }, 0.5);
    tl.fromTo("#rc-fair", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.0);
    const ck = { v: 0 };
    tl.fromTo(ck, { v: 0 }, { v: 45000000, duration: 1.8, ease: "power2.out",
      onUpdate: () => { document.getElementById("rc-n").textContent = (Math.round(ck.v / 100000) * 100000).toLocaleString("en-US"); } }, 2.6);
    tl.fromTo("#rc-lead", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 12.6);

    for (let i = 9; i >= 3; i--) tl.fromTo(`#rc-r${i}`, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 6.6 + (9 - i) * 0.25);
    tl.fromTo("#rc-board .rc-row:nth-child(n+4) .rc-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out", stagger: 0.1 }, 6.7);
    tl.fromTo("#rc-key", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.4);
    tl.fromTo(["#rc-r2", "#rc-r1", "#rc-r0"], { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out", stagger: 0.3 }, 10.2);
    tl.fromTo("#rc-board .rc-ours .rc-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out", stagger: -0.3 }, 10.3);
    tl.fromTo("#rc-cost", { opacity: 0, scale: 1.5, rotation: -5 }, { opacity: 1, duration: 0.01 }, 15.6);
    tl.to("#rc-cost", { scale: 1, duration: 0.14, ease: "power4.out" }, 15.61);
    window.__timelines["race"] = tl;
